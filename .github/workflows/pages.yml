name: Publish released web game
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to deploy
        required: true
        default: v0.0.1
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the released web build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          mkdir release _site
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Cyber-Kingdom-Web-*.zip' --pattern 'SHA256SUMS.txt' --dir release
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          root = Path('release')
          archives = list(root.glob('Cyber-Kingdom-Web-*.zip'))
          if len(archives) != 1:
              raise SystemExit('Expected one web archive')
          archive = archives[0]
          checksums = dict(line.split(maxsplit=1)[::-1] for line in (root/'SHA256SUMS.txt').read_text().splitlines())
          if hashlib.sha256(archive.read_bytes()).hexdigest() != checksums.get(archive.name):
              raise SystemExit('Web archive checksum mismatch')
          destination = Path('_site').resolve()
          with zipfile.ZipFile(archive) as bundle:
              for entry in bundle.infolist():
                  target = (destination/entry.filename).resolve()
                  if not target.is_relative_to(destination) or (entry.external_attr >> 16) & 0o170000 == 0o120000:
                      raise SystemExit('Unsafe archive path')
              bundle.extractall(destination)
          for name in ('index.html', 'index.js', 'index.wasm', 'index.pck', 'guide.html'):
              if not (destination/name).is_file() or (destination/name).stat().st_size == 0:
                  raise SystemExit('Missing web runtime: '+name)
          (destination/'.nojekyll').touch()
          PY
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
